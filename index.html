<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tank Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
        }
        #canvas {
            display: block;
            width: 100%;
            height: 100vh;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #0f0;
            font-size: 16px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border: 2px solid #0f0;
            border-radius: 5px;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #0f0;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border: 2px solid #0f0;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div>Tank Game</div>
        <div>Position: <span id="pos">0, 0, 0</span></div>
        <div>Rotation: <span id="rot">0°</span></div>
    </div>
    <div id="instructions">
        <div>📖 Controls:</div>
        <div>W/A/S/D - Move</div>
        <div>Mouse - Aim Turret</div>
        <div>Click - Fire</div>
        <div>Space - Jump</div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
